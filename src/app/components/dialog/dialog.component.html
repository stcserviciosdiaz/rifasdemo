<div
  class="toast-container position-fixed bottom-0 end-0 p-3"
  style="z-index: 1055;"
  aria-live="polite"
  aria-atomic="true"
>
  <div
    id="liveToast"
    class="toast"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div class="toast-header">
      <strong class="me-auto">⚡ Notificación</strong>
      <small>Ahora</small>
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="toast"
        aria-label="Close"
      ></button>
    </div>
    <div *ngIf="currentMessage" class="toast-body">
      {{ currentMessage.description }}
    </div>
  </div>
</div>
