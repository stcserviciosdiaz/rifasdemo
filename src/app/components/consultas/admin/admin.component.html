<div class="container-fluid">
  <div class="row">
    <nav id="sidebarMenu" class="bg-dark col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
      <div class="position-sticky pt-3">
        <a href="/"
           *ngFor="let logoadmin of logorifa" 
           class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
          <img 
            class="cursor-pointer bg-img"
            src="../../../assets/images/{{ logoadmin.imagen }}" alt="">
        </a>
        <hr>

        <ul class="nav flex-column">
          <li class="nav-item" *ngFor="let rifaoff of imagendelarifa">
            <a
              class="nav-link"
              [ngClass]="{ active: rifaSeleccionada === rifaoff.coleccion }"
              href="javascript:void(0)"
              (click)="cargarRifa(rifaoff.coleccion)">
              <img
                class="cursor-pointer bg-rifa"
                [src]="'../../../assets/images/' + rifaoff.imagen"
                alt="">
            </a>
          </li>
        </ul>

      </div>
    </nav>

    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
      <div class="chartjs-size-monitor">
        <div class="chartjs-size-monitor-expand">
          <div class=""></div>
        </div>
        <div class="chartjs-size-monitor-shrink">
          <div class=""></div>
        </div>
      </div>
      
      <h2>
        Rifa Demo          
      </h2>
      <div class="table-responsive">
        <div class="">
          <h5>Datos de Registrados en compra de números</h5>

          <button class="btn btn-danger mb-3" (click)="cerrarSesion()">
            Cerrar sesión
          </button>
          <button class="btn btn-success mb-3 mx-2" (click)="exportarExcel()">Exportar Excel</button>
          <button class="btn btn-primary mb-3" (click)="exportarPDF()">Exportar PDF</button>
          
          <!-- Filtro -->
          <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3">
            <input 
              type="search" 
              [(ngModel)]="filtro"
              name="filtroBusqueda"
              class="form-control form-control-dark" 
              placeholder="Buscar por nombre o número..." 
              aria-label="Buscar">
          </form>

          <div class="table-responsive">
            <table class="table table-striped table-sm">
              <thead>
                <tr>
                  <th scope="col">Nombre</th>
                  <th scope="col">Código de Área</th>
                  <th scope="col">Celular</th>
                  <th scope="col">Números comprados</th>
                  <th scope="col">Notificaciones</th>
                  <th scope="col">Confirmaciones</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let u of usuariosFiltrados; let i = index" 
                    [class.bloqueado]="u.bloqueado" 
                    [attr.id]="'ID_DIV_' + i">

                  <!-- Contenido con texto resaltado -->
                  <td [innerHTML]="resaltarTexto(u.nombre)"></td>
                  <td>{{ u.codigoArea }}</td>
                  <td>{{ u.celular }}</td>
                  <td [innerHTML]="resaltarTexto(u.numeros)"></td>

                  <td>
                    <button class="btn btn-sm btn-outline-danger" (click)="eliminarRegistro(i)" [disabled]="u.bloqueado">
                      <i class="fa fa-trash-o" aria-hidden="true"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-success"
                            [disabled]="u.bloqueado || estaDeshabilitado(u.celular)"
                            [innerHTML]="obtenerTextoBoton(u.celular)"
                            (click)="notificarWhatsApp(u)">
                    </button>
                    <button class="btn btn-sm btn-outline-info">
                      <i class="fa fa-envelope" aria-hidden="true"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-primary" (click)="printDiv('ID_DIV_' + i)">
                      <i class="fa fa-print" aria-hidden="true"></i>
                    </button>
                  </td>
                  
                  <td>
                    <div class="form-check form-switch">
                      <input class="form-check-input" type="checkbox"
                            [id]="'switch-' + i"
                            [(ngModel)]="u.bloqueado"
                            (change)="onSwitchChange(u)">
                      <label class="form-check-label fx-12" [for]="'switch-' + i">
                        {{ u.bloqueado ? 'Confirmado' : 'Confirmar' }}
                      </label>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

</div>
